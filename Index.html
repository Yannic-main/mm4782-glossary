<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikarten – Week 2 Glossar</title>
<style>
:root{--paper:#E6EBEE;--card:#FFFFFF;--ink:#1C2A39;--muted:#5F6E7C;--rule:#C9D2D9;--ok:#1F6F5C;--again:#6E3D66}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{max-width:560px;width:100%;margin:0 auto;padding:14px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:14px}
header strong{color:var(--ink);font-weight:600}
.bar{max-width:560px;width:100%;margin:0 auto 14px;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
main{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column}
#card{flex:1;background:var(--card);border-radius:14px;border:1px solid var(--rule);padding:22px 22px 26px;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;min-height:52vh}
#card:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.side{font-size:13px;color:var(--muted);margin:0 0 14px}
.term{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0}
.def{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(19px,4.6vw,22px);line-height:1.5;margin:0;max-width:34em}
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center}
.answer{border-top:1px solid var(--rule);margin-top:20px;padding-top:18px}
.hint{margin-top:18px;color:var(--muted);font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 0 10px}
.actions button{border:0;border-radius:12px;padding:17px 10px;font:600 17px/1 inherit;font-family:inherit;color:#fff;cursor:pointer}
#again{background:var(--again)}#ok{background:var(--ok)}
.actions[hidden]{display:none}
footer{max-width:560px;width:100%;margin:0 auto;padding:4px 0 16px;display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
footer button{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left}
.done h2{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:32px;font-weight:400;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header><span><strong id="left">0</strong> offen</span><span><span id="known">0</span> von <span id="total">0</span> verstanden</span></header>
<div class="bar"><i id="fill"></i></div>
<main id="main"></main>
<footer><span id="storeNote"></span><button id="reset" type="button">Fortschritt zurücksetzen</button></footer>
<script>
const CARDS = [["Sales organisation", "The way a business arranges sales roles, decision rights, reporting relationships, territories, accounts, and channels to serve customers."], ["Organisation structure", "The formal pattern of roles and reporting relationships in a team."], ["Dominant organising logic", "The main principle used to arrange sales work. It is the first organising choice, even if you add other features later."], ["Hybrid structure", "A design that combines two or more organising logics, such as territories plus key-account managers."], ["Coordination cost", "The time, effort, delay, and friction needed to align people who depend on each other."], ["Buyer relevance", "How well the sales approach matches the customer's needs, decision process, and preferred buying method."], ["Sales strategy", "The choices a firm makes about which customers to serve, what value it offers, and how it will compete and sell."], ["Sales programme", "The planned set of sales objectives, activities, people, systems, and controls used to deliver the sales strategy."], ["Formulate (sales programme)", "To develop and choose a plan before acting."], ["Implement (sales programme)", "To put a plan into practice through people, processes, tools, and actions."], ["Evaluate and control", "To monitor results, learn what is happening, and correct or adjust the plan."], ["Management system", "The routines, information, measures, incentives, and decision rules that help managers direct and improve work."], ["Deploy work", "To assign people, time, accounts, roles, and tasks to make strategy happen."], ["Enable people", "To provide the skills, tools, information, coaching, and incentives needed to execute well."], ["Feedback", "Information about results or experience that can improve the next decision."], ["Performance information", "Evidence about results, behaviours, workload, customer experience, and process quality."], ["Account", "A customer organisation, company, public agency, or buying entity that a seller manages over time."], ["Named account", "A selected high-value or strategically important customer assigned to a specific owner or team."], ["Strategic account", "An account that matters disproportionately because of revenue, growth potential, strategic fit, complexity, or influence."], ["Key-account manager (KAM)", "A seller or manager who coordinates value, relationships, and plans for a named strategic account."], ["Account-quality rules", "Published criteria for deciding which customers qualify for named-account treatment and when they leave that category."], ["Account plan", "A documented plan for an important customer, including goals, stakeholders, opportunities, roles, actions, and risks."], ["Customer tier", "A group of customers with similar value, complexity, or service needs that receives a defined coverage approach."], ["Tier 1", "The highest-priority customer tier, usually requiring human-led strategic attention and relationship ownership."], ["Tier 2", "A middle tier that needs some seller attention and may need specialist or partner support, but not a full key-account approach."], ["Tier 3", "A larger or lower-complexity customer tier served through a reliable, scalable, lower-cost route."], ["Customer portfolio", "The complete mix of customers or customer segments a company serves."], ["Customer fit", "The extent to which a sales design matches the customer's value, needs, complexity, location, and buying journey."], ["Buying group", "The people who influence, recommend, approve, use, or pay for a purchase within a customer organisation."], ["Stakeholder", "A person or group with an interest in, influence on, or impact from a buying decision."], ["White space", "Untapped potential in an existing customer, market, product category, or territory."], ["Long tail", "A large number of smaller or lower-value customers that collectively may matter but cannot each receive intensive field coverage."], ["Territory", "A defined geographic area, market patch, or set of accounts allocated to a sales role."], ["Territory boundary", "The line or rule that separates one territory's responsibility from another's."], ["Territory design", "The process of allocating selling responsibility so that opportunity and workload are deliberately balanced."], ["Workload balance", "A condition in which sellers have reasonably comparable and feasible amounts of selling work, not simply the same number of accounts."], ["Potential", "The likely value or opportunity an account or territory could create, including current revenue, growth, white space, and strategic fit."], ["Complexity", "The amount of expertise, coordination, stakeholder work, solution design, and sales-cycle effort required."], ["Access cost", "The time, money, friction, and effort required to reach and serve a customer."], ["Capacity", "The available time, skill, and support resources that can be devoted to customers."], ["Coverage", "The planned level and form of sales attention given to customers or segments."], ["Coverage route", "The repeatable way a customer type is served: primary owner, contributors, channel, interaction mode, depth, information record, service promise, and escalation rule."], ["Coverage depth", "How much human time, expertise, contact frequency, and tailored support a customer receives."], ["Coverage economics", "The relationship between the cost of serving customers and the value or strategic benefit created by that service."], ["Primary coverage route", "The main route chosen for a segment, even if an exception can receive another route."], ["Route-to-market", "The path through which a company reaches, sells to, delivers to, or supports customers."], ["Direct seller", "A company employee who sells directly to the customer and often owns complex commercial relationships."], ["Field seller", "A seller who meets customers in person or works in a defined geographical market."], ["Inside sales", "A sales role that works remotely, often using phone, email, video, and digital tools to qualify, nurture, and close or route customers."], ["Digital coverage", "Customer discovery, education, qualification, nurture, or support delivered through digital tools and automated or self-service experiences."], ["SKU", "Stock-keeping unit: a distinct product item or product version sold by a company."], ["Channel", "A route or intermediary through which a company reaches customers, such as direct sales, a distributor, a reseller, or digital/inside sales."], ["Channel coverage", "Using direct, partner, distributor, inside, or digital routes to reach and serve a segment of customers."], ["Partner", "An external organisation that helps sell, deliver, implement, or support an offering."], ["Distributor", "A partner that buys, resells, or delivers products into a market, often serving many smaller customers."], ["Channel conflict", "Disagreement or competition between routes-to-market, often when direct sellers and partners pursue the same customer or dispute credit."], ["Handoff", "The transfer of the next customer-facing action or responsibility from one role or route to another."], ["Accountable handoff", "A handoff with a named receiving owner, a shared record, a response expectation, acceptance, and an escalation rule."], ["Owner", "The role accountable for the next customer-facing action and for moving the customer or record to the next agreed state."], ["Contributor", "A person or role that supplies expertise, local access, implementation, or support but does not own the next customer action."], ["Shared information", "The minimum current facts that all relevant contributors can see in one source of truth."], ["CRM", "Customer relationship management system: a shared system for recording customer, lead, account, opportunity, activity, and ownership information."], ["CRM record", "The specific account, lead, opportunity, or case entry in the CRM that holds the shared information and ownership status."], ["Lead", "A possible customer or possible sales opportunity that has not yet been fully qualified or accepted into a seller's active responsibility."], ["Lead qualification", "The process of checking whether a lead fits the target customer, has a genuine need or opportunity, and merits further sales attention."], ["Lead registration", "Recording a lead in the CRM so the company can identify its source, owner, partner involvement, and status."], ["Response time", "The time between a customer action or handoff and the next expected response."], ["Service-level agreement (SLA)", "A documented standard for timing, quality, or responsibility in a service or handoff."], ["Escalation trigger", "A condition that requires a manager or governance role to decide because the normal process cannot continue safely, fairly, or effectively."], ["Decision rights", "Clarity about who has authority to make a particular decision."], ["Commercial credit", "The agreed recognition or reward given to a seller or partner for contributing to a sale."], ["Diagnose", "To investigate a problem and identify likely causes before choosing an intervention."], ["Evidence", "Information that supports or challenges a claim or decision."], ["Non-CRM evidence", "Customer, market, or operational information that is not fully captured in the CRM."], ["Metric", "A defined measure used to track performance, quality, or progress."], ["Leading metric", "A measure that changes early and may predict a later result."], ["Outcome metric", "A measure of a result after the process has happened."], ["Signal", "A meaningful piece of information that suggests a condition, risk, change, or opportunity."], ["Redraw trigger", "A signal or threshold that should cause managers to review or redesign the sales organisation, territory, or coverage route."], ["Trade-off", "A benefit gained by a choice that also creates a cost, risk, or limitation that must be managed."], ["Conflict governance", "The rules, roles, and decision process used to prevent or resolve disputes between sellers, territories, or channels."], ["Role clarity", "A shared understanding of who is accountable, who contributes, and who decides."], ["Customer promise", "What a customer can reasonably expect from a coverage route, such as response time, access to a person, expertise, or self-service support."], ["Cost-to-serve", "The time, money, resources, and effort required to sell to, onboard, and support a customer or segment."], ["Route friction", "Delays, effort, or confusion created as a customer moves across roles, systems, or channels."], ["Service footprint", "The locations, capabilities, and delivery reach available to serve customers."], ["Changing environment", "The customer, competitor, technology, regulatory, or market conditions that require managers to review how sales work is organised."], ["Sense (changing environment)", "To notice and interpret changes in customers, competitors, technology, regulation, or performance."], ["Redesign", "To deliberately change roles, coverage, skills, incentives, handoffs, or information rules in response to evidence."], ["Augment", "To use technology to improve or extend human work rather than replace a role."], ["AI agent", "A software system that can use information and defined rules to perform or coordinate tasks toward a goal, often with some degree of autonomy."], ["Augmented AI", "AI provides a recommendation, analysis, or suggestion; a person decides and performs the action."], ["Assisted AI", "AI works with a person in real time, while the person reviews, approves, or sends the result."], ["Autonomous AI", "AI completes a bounded, repeatable action under predefined rules, with humans owning policy, exceptions, and oversight."], ["Human oversight", "Human review, approval, accountability, or intervention where judgment, trust, risk, or exceptions matter."], ["Guardrail", "A rule, limit, check, or escalation mechanism that prevents a process or AI system from causing avoidable harm or acting outside its approved scope."], ["Human decision retained", "A consequential decision that remains with a person even when AI supports the work."], ["Audit trail", "A traceable record of what action occurred, when, using which information, and under whose authority."], ["Exception routing", "A rule for sending unusual, high-risk, high-value, or uncertain cases to an appropriate human owner."], ["Data quality", "The accuracy, completeness, timeliness, consistency, and suitability of data for a decision."], ["Consent", "A customer's permission for particular communication or data use, where required by law or policy."], ["Case", "A short, realistic business situation used to practise applying concepts and making decisions."], ["Customer pathway", "The deliberate sequence through which a customer enters, is qualified, receives a proposal or sale, is onboarded, and is renewed or expanded, with a named owner at each stage."], ["Onboarding", "The process of moving a customer from purchase or agreement into successful setup, implementation, adoption, or use."], ["Customer success", "A role or function focused on helping customers achieve value, adopt the solution, renew, and expand after the sale."], ["Pilot", "A limited trial or early implementation used to test a solution before full rollout."], ["Design sprint", "A short, timeboxed team process for making a visible first design, testing it against criteria, and improving it through feedback."], ["Timebox", "A fixed amount of time assigned to an activity or decision."], ["Preliminary organisation/pathway", "The first defendable version of a group's structure and customer pathway, not a final corporate redesign."], ["90-second rationale", "A short, evidence-based explanation of the group's main design choice, trade-off, and test metric."], ["Gallery walk", "A brief peer-review activity in which teams inspect another team's work and leave focused feedback."], ["Stress test", "A deliberate challenge question used to see whether a design still works under realistic conditions or constraints."], ["Design criterion", "A standard for judging whether a proposed design is strong enough."], ["Customer ownership", "Clear accountability for the next customer-facing action and relationship across the pathway."], ["Visible design output", "A diagram, table, worksheet, or other artefact that makes a team's choices understandable and open to challenge."], ["Exception", "A customer or situation that does not fit the normal coverage route and needs a defined alternative."]];
const KEY = "mm4782-week2-known-v1";
let storageOK = true;
function load(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){storageOK=false;return new Set()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){storageOK=false;note()}}
function note(){document.getElementById("storeNote").textContent = storageOK ? "" : "Fortschritt wird in diesem Browser nicht gespeichert."}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let known = load();
let queue = [], current = null, revealed = false;
const main = document.getElementById("main");

function start(){
  queue = shuffle(CARDS.map((_,i)=>i).filter(i=>!known.has(CARDS[i][0])));
  next();
}
function stats(){
  document.getElementById("total").textContent = CARDS.length;
  document.getElementById("known").textContent = known.size;
  document.getElementById("left").textContent = queue.length + (current!==null?1:0);
  document.getElementById("fill").style.width = (known.size/CARDS.length*100)+"%";
}
function next(){
  current = queue.length ? {i:queue.shift(), termFirst:Math.random()<.5} : null;
  revealed = false; render();
}
function render(){
  stats(); note();
  if(current===null){
    main.innerHTML = `<div class="done"><h2>Alle Karten verstanden.</h2><p>Setz den Fortschritt zurück, um den Stapel neu zu lernen.</p></div>`;
    return;
  }
  const [t,d] = CARDS[current.i];
  const q = current.termFirst ? `<p class="term">${esc(t)}</p>` : `<p class="def">${esc(d)}</p>`;
  const a = current.termFirst ? `<p class="def">${esc(d)}</p>` : `<p class="term">${esc(t)}</p>`;
  main.innerHTML = `
    <button id="card" type="button" aria-live="polite">
      <p class="side">${current.termFirst ? "Begriff – wie lautet die Definition?" : "Definition – welcher Begriff?"}</p>
      <div class="prompt">${q}${revealed ? `<div class="answer">${a}</div>` : `<p class="hint">Tippen zum Aufdecken</p>`}</div>
    </button>
    <div class="actions" ${revealed?"":"hidden"}>
      <button id="again" type="button">Nochmal</button>
      <button id="ok" type="button">Verstanden</button>
    </div>`;
  document.getElementById("card").onclick = ()=>{ if(!revealed){revealed=true;render();document.getElementById("ok").focus({preventScroll:true});} };
  if(revealed){
    document.getElementById("ok").onclick = ()=>{known.add(t);save();next();};
    document.getElementById("again").onclick = ()=>{queue.push(current.i);next();};
  }
}
document.getElementById("reset").onclick = ()=>{
  if(confirm("Alle Karten wieder als offen markieren?")){known=new Set();save();start();}
};
start();
</script>
</body>
</html>
